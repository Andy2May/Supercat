name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
  wasm-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo install wasm-pack --version 0.13.1 --locked
      - run: wasm-pack test --node wasm
      # This job already has wasm-pack and the wasm target, so it is also the
      # one place per commit that builds the web glue (same command as local
      # `npm run build:wasm`); the web job downloads the output instead of
      # rebuilding it.
      - run: wasm-pack build wasm --target web --out-dir ../web/src/wasm/psiforge-wasm
      - uses: actions/upload-artifact@v4
        with:
          name: psiforge-wasm-web
          path: web/src/wasm/psiforge-wasm
          if-no-files-found: error
  web:
    needs: wasm-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      # The web app imports the gitignored wasm-pack output, which the
      # wasm-test job built once and uploaded (one wasm-pack build per
      # commit) — no Rust toolchain needed in this job.
      - uses: actions/download-artifact@v4
        with:
          name: psiforge-wasm-web
          path: web/src/wasm/psiforge-wasm
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # svelte-check + tsc; must run after the wasm package is in place
      # because the check resolves the gitignored wasm glue .d.ts that
      # wasm-pack emits.
      - run: npm run check
      - run: npm run build
      - run: npm run test
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
