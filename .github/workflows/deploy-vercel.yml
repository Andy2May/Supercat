name: deploy-vercel

# Vercel mirror deploy (2026-10-02): hands the SAME prebuilt web/dist the
# Pages workflow produces to Vercel via the CLI, so no Rust toolchain is
# installed on Vercel's builders and the Swatinem rust-cache is reused.
# Gated by the VERCEL_ENABLED repository variable: the job reads as
# "skipped" (never red) until the one-time setup is done:
#   secrets VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID
#   variable VERCEL_ENABLED = true
# See AGENTS.md deploy notes for the `vercel link` step that fills the ids.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    if: vars.VERCEL_ENABLED == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      # Same toolchain as deploy-pages/ci: the app imports the gitignored
      # wasm-pack output, so it is rebuilt here before `npm run build`.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack 0.13.1 (prebuilt)
        run: |
          curl -sSL https://github.com/rustwasm/wasm-pack/releases/download/v0.13.1/wasm-pack-v0.13.1-x86_64-unknown-linux-musl.tar.gz | tar xz -C "$HOME"
          echo "$HOME/wasm-pack-v0.13.1-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm run build:wasm
      - run: npm ci
      # Prebuilt recipe (the plain "deploy dist" form still runs the
      # project's cloud build, which 127s with no node_modules): pull writes
      # .vercel from the ORG/PROJECT envs, build runs the project's own
      # "vite build" HERE on the runner, deploy --prebuilt ships the
      # assembled .vercel/output with no cloud build at all.
      - name: Deploy prebuilt to Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx vercel@latest pull --yes --environment=production --token ${{ secrets.VERCEL_TOKEN }}
          npx vercel@latest build --prod --token ${{ secrets.VERCEL_TOKEN }}
          npx vercel@latest deploy --prebuilt --prod --yes --token ${{ secrets.VERCEL_TOKEN }}
