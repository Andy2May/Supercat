[package]
name = "psiforge-wasm"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "WebAssembly bindings exposing the Psiforge 2D quantum simulation core"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
psiforge-core = { path = "../core" }
wasm-bindgen = "0.2"
js-sys = "0.3"

[dev-dependencies]
wasm-bindgen-test = "0.3"
