<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Psiforge favicon (UI redesign T10): the psi glyph — the app's symbol,
       |ψ|² is the observable — drawn as two bold strokes in the accent color
       on the page ground. Pure paths (no <text>), so it renders identically
       everywhere and stays legible at 16px: 8/64 stroke = 2px at tab size. -->
  <rect width="64" height="64" rx="14" fill="#0B0E14" />
  <g stroke="#5FD4E6" stroke-width="8" stroke-linecap="round" fill="none">
    <!-- The cup: two arms joined by a round bottom -->
    <path d="M18 16v20a14 14 0 0 0 28 0V16" />
    <!-- The stem: crosses the cup and descends past it -->
    <path d="M32 8v48" />
  </g>
</svg>
